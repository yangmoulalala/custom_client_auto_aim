#####-----ROS2 AUV Client-----#####
# 实时输入输出话题；均使用 best-effort、keep last 1，话题名修改后需同步上下游。
ros_image_topic: "/rm_video/image_processed"
ros_imu_topic: "/rm_mqtt/imu"
ros_result_topic: "/auto_aim/result"
ros_debug_topic: "/auto_aim/debug"

# 弹丸初速，单位 m/s，用于重力弹道和飞行时间预测；应填写测速结果。
# 注意：Aimer 当前会把小于 14 m/s 的值回退为 23 m/s。
bullet_speed: 24.0
# 图像曝光/采集到上游发布时间之间未体现在 header.stamp 中的固定延迟，单位 ms。
# 增大后会增加预测前推量，但不会改变相邻帧的 Tracker 时间间隔。
upstream_latency_ms: 00.0

# 必须填写为下方 camera_matrix 标定时使用的图像分辨率。
# 保持为 0 时 auv_client 会拒绝启动，避免使用错误内参。
calibration_image_width: 480
calibration_image_height: 270

# 图像与最近 IMU 时间戳允许的最大差值，单位 ms；过大会配到错误姿态。
sync_tolerance_ms: 500
# 暂时没有匹配 IMU 时等待的最长时间，单位 ms；过大会直接增加输出延迟。
sync_wait_ms: 1000
# 图像有效帧龄上限，单位 ms，判定时包含 upstream_latency_ms。
max_frame_age_ms: 1000
# 没有新结果时发布一次安全命令的看门狗超时，单位 ms。
command_timeout_ms: 1000

# Tracker 的启动初值；AUV Client 收到 self_is_red 后会改为对方颜色并重置 Tracker。
# 未收到阵营时只发布安全结果，因此正常联调不要靠这里手工切换红蓝方。
enemy_color: "red"
# enemy_color: "blue"

#####-----神经网络参数-----#####
# 检测器类型；代码会读取同名的 <yolo_name>_model_path。
yolo_name: yolov5
# OpenVINO 可读取的 YOLOv5 模型路径。更换模型后要重新核对输入/输出布局和颜色顺序。
yolov5_model_path: auto_aim/RobotDetectionModel/Model/0526.onnx
# 模型颜色通道顺序，只支持 red_blue_gray_purple 或 blue_red_gray_purple。
# 0526.onnx 实测顺序为蓝、红、灰、紫，设错会导致敌我颜色颠倒。
yolov5_color_order: blue_red_gray_purple
# OpenVINO 推理设备，例如 AUTO、CPU、GPU；AUTO 由运行时选择可用设备。
device: AUTO
# 传统角点修正内部仍会构造数字分类器；路径必须存在，即使 use_traditional=false。
classify_model: auto_aim/assets/tiny_resnet.onnx
# 检测结果的最小置信度；提高可减少误检，也会增加远距离漏检。
min_confidence: 0.8
# true 时用传统灯条方法二次修正 YOLO 四角点，不会替代 YOLO 检测。
use_traditional: false

#####-----ROI-----#####
# YOLO 推理裁剪区域，单位 pixel，相对输入图左上角；只在 use_roi=true 时生效。
# width/height=-1 表示该维不裁切，只有对应 x/y=0 时才能安全覆盖整幅图。
roi:
  x: 0
  y: 0
  width: -1
  height: -1
# 开启可降低推理区域并屏蔽无关画面，但目标离开 ROI 后将完全不可见。
use_roi: false

#####-----传统识别参数-----#####
# 以下参数仅用于传统灯条检测/YOLO 角点二次修正；use_traditional=false 时不影响 YOLO 结果。
# 灰度二值化阈值 [0,255]；提高会减少暗噪声，也可能丢失暗灯条。
threshold: 150
# 灯条方向相对竖直方向的最大误差，单位 degree。
max_angle_error: 45
# 灯条长宽比的开区间；收紧可抑制形状异常的候选。
min_lightbar_ratio: 1.5
max_lightbar_ratio: 20
# 灯条最小像素长度；提高可减少远处小噪声，也会缩短识别距离。
min_lightbar_length: 8
# 装甲板宽高比的开区间。
min_armor_ratio: 1
max_armor_ratio: 5
# 左右灯条长度比上限，越接近 1 要求两根灯条越等长。
max_side_ratio: 1.5
# 装甲板上下边不平行/矩形形变的最大误差，单位 degree。
max_rectangular_error: 25

#####-----tracker参数-----#####
# 从 detecting 进入 tracking 所需的连续检出帧数；提高更稳但起控更慢。
min_detect_count: 5
# 普通目标连续丢失后仍保留预测的帧数；提高可抗短遮挡，也会延长旧目标控制。
max_temp_lost_count: 5
# 前哨站对应的临时丢失帧数上限。
outpost_max_temp_lost_count: 10

#####-----aimer参数-----#####
# 固定 yaw 补偿，单位 degree，正值使输出 yaw 增大。
yaw_offset: 0
# 固定弹道 pitch 补偿，单位 degree；输出公式为 -(弹道仰角 + pitch_offset)，正值使输出更负。
pitch_offset: 0
# 旋转目标装甲板进入/离开可瞄区的角度，单位 degree。comming 是代码中的历史拼写，不能改名。
# 当前非前哨站正常路径使用硬编码 60 degree，前哨站使用 70/30 degree，这两个配置基本不生效。
comming_angle: 100
leaving_angle: 0
# 兼容上游配置保留；当前 AUV Client/Aimer 没有读取此字段，修改不会生效。
min_spin_speed: 2
# 高低速附加预测的切换阈值，单位 rad/s；正反转均使用角速度绝对值与该阈值比较。
decision_speed: 12
# 高/低速目标在帧龄和弹丸飞行时间之外增加的预测时间，单位 s。
# 增大表示瞄得更靠前；需分别测试正反方向旋转，避免过预测。
high_speed_delay_time: 0.005
low_speed_delay_time: 0.005

#####-----shooter参数-----#####
# 水平距离 <= judge_distance 时使用的 yaw 开火容差，单位 degree。
first_tolerance: 2.5
# 水平距离 > judge_distance 时使用的 yaw 开火容差，单位 degree。
second_tolerance: 2.5
# 近/远容差的水平距离分界，单位 m。
judge_distance: 0.5
# 自瞄侧开火总开关；false 时仍输出角度，但 shoot 始终为 false。
auto_fire: true

#####-----相机标定参数-----#####
# 3x3 行主序旋转矩阵，将 gimbal 轴映射到 IMU body 轴；由机械安装确定，手眼工具不负责辨识。
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]
# OpenCV 3x3 行主序内参 [fx,0,cx, 0,fy,cy, 0,0,1]，对应上方标定分辨率。
camera_matrix: [689.17782867242408, 0, 263.03005188708039, 0, 688.65887141546, 139.58627690456646, 0, 0, 1]
# OpenCV 五参数畸变 [k1,k2,p1,p2,k3]。
distort_coeffs: [-0.27214187315547, 1.4224009167280049, 0.0045267040990549148, 0.0055930843150677383, 0]
# 3x3 行主序主动旋转：camera optical 坐标中的向量转到 gimbal 坐标。
R_camera2gimbal: [0.014679100551504121, -0.025612577151355564, 0.99956416497324696, -0.99933044887885791, 0.033130661636021852, 0.015524599934928607, -0.033513847146798559, -0.99912279282940253, -0.025109099908115606]
# 相机光心在 gimbal 坐标中的位置 [x,y,z]，单位 m。
t_camera2gimbal: [-0.011407068198318614, -0.044912968154257979, 0.041049026928921747]
