# 棋盘格参数：横向11格、纵向8格，对应内部角点10x7
pattern_cols: 10
pattern_rows: 7
square_size_mm: 50

# ROS2 标定工具直接订阅的 JPEG sensor_msgs/CompressedImage 话题，必须与自瞄最终画面一致。
ros_image_topic: "/rm_video/image_processed"
# 手眼标定使用的 IMU 姿态话题；图像和 IMU 的 header.stamp 必须使用同一 ROS 时钟。
ros_imu_topic: "/rm_mqtt/imu"
# 图像与最近 IMU 的最大时间差，单位 ms，必须非负；增大会增加姿态错配风险。
sync_tolerance_ms: 100
# 等待容差内 IMU 的最长时间，单位 ms，必须非负；超时丢弃图像，不插值或外推姿态。
sync_wait_ms: 200

# 先运行 ros_calibrate_camera，并将其输出复制到这里，再进行手眼标定。
calibration_image_width: 480
calibration_image_height: 270
camera_matrix: [721.05129460224953, 0, 250.14452151918877, 0, 719.46932979581152, 139.75331117068609, 0, 0, 1]
distort_coeffs: [-0.16665637449145251, -0.75513154087444823, -0.0015350990693406591, 0.0021629593172751162, 0]

# gimbal 轴到 IMU body 轴的机械安装映射，3x3 行主序；手眼工具只校验并原样写回。
R_gimbal2imubody: [1, 0, 0, 0, 1, 0,  0, 0, 1]

# 以下为上游工业相机/CBoard 标定程序的兼容字段，当前 ros_calibrate_* 工具不会读取。
camera_name: "hikrobot"
exposure_ms: 3
gain: 10.0
vid_pid: "2bdf:0001"

#####-----cboard参数-----#####
quaternion_canid: 0x01
bullet_speed_canid: 0x110
send_canid: 0xff
can_interface: "can0"
